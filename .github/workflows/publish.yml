name: Publish to Open VSX

# Trusted publishing (OIDC): no access token or secret is stored.
# Registered on open-vsx.org -> Settings -> Trusted Publishers
# (train-horn/vscode-trainhorn, workflow publish.yml, no environment).
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Extension-host smoke test
        run: xvfb-run -a npm run test:integration
      - name: Package
        run: npx vsce package --no-dependencies -o trainhorn-sound-level.vsix
      - name: Publish (trusted publishing, ovsx >= 1.4)
        run: npx ovsx publish trainhorn-sound-level.vsix --trusted-publishing
